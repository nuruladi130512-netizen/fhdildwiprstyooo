<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu, Cintaku!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #fff;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .surprise-button {
            background-color: #ff6f61;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }
        .surprise-button:hover {
            background-color: #e05e55;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .surprise-content {
            margin-top: 30px;
            font-size: 1.5em;
            font-weight: bold;
            color: #ff6f61;
            display: none; /* Hidden by default */
            animation: slideInUp 0.8s ease-out;
        }
        .heart {
            position: absolute;
            background-color: #ff6f61;
            transform: rotate(-45deg);
            width: 20px;
            height: 20px;
            opacity: 0;
            animation: floatHearts 6s infinite ease-in;
            z-index: 5;
        }
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff6f61;
            border-radius: 50%;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            left: 10px;
            top: 0;
        }

        /* Animation Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatHearts {
            0% { transform: translateY(0) rotate(-45deg) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-1000px) rotate(-45deg) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hai, Sayangku!</h1>
        <p>Ada pesan rahasia khusus untuk kamu.<br>Klik tombol di bawah ini untuk melihatnya!</p>
        <button class="surprise-button" onclick="showSurprise()">Buka Kejutan Ini!</button>
        <div class="surprise-content" id="surpriseMessage">
            "Setiap detik bersamamu adalah kebahagiaan terindah. Aku sangat mencintaimu!" ❤️
        </div>
    </div>

    <script>
        function showSurprise() {
            const surpriseMessage = document.getElementById('surpriseMessage');
            surpriseMessage.style.display = 'block'; // Show the hidden message
            document.querySelector('.surprise-button').style.display = 'none'; // Hide the button

            // Buat efek hati bertebaran
            for (let i = 0; i < 20; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw'; // Posisi horizontal acak
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // Durasi animasi acak
            heart.style.animationDelay = Math.random() * 2 + 's'; // Delay animasi acak
            document.body.appendChild(heart);

            heart.addEventListener('animationend', () => {
                heart.remove();
            });
        }

        // Generate some initial floating hearts for background effect
        for (let i = 0; i < 10; i++) {
            createHeart();
        }
    </script>
</body>
</html>
